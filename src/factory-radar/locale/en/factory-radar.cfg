[tr-help]
tr-zap-lift=If the lightning does not hit the player, raise or lower it (admin only): /tr-zap-lift 4
tr-in=Agree to take part in the quiz while the sign-up is open: /tr-in
tr-roulette=Start the fun quiz (at least two must agree; a new one cannot be started while the previous one is running): /tr-roulette
tr-zap=Strike a player with lightning (takes a share of health, never kills, has a cooldown): /tr-zap Oleg
faq-6=[font=default-bold]What if MVP votes are tied?[/font] There will be several MVPs - everyone with the most votes.
how=[img=utility/tip_icon] How to use
how-1=• Open the window with the radar button in the top-left corner, [font=default-bold]Ctrl+Shift+R[/font] or the shortcut bar.
how-2=• The switch in the window title: “This shift” (default) or “All time” - applies to every tab.
how-3=• Team → Who's where: [img=tr-map-frame] - move your view to the player, [img=utility/search] - to where they are looking.
how-4=• Your chat title is under Team → Titles. Vote for the MVP on Summary.
how-5=• Hide tabs and messages in Settings (everyone has their own). Admins also set tracking, messages, titles and planets' local science there.
commands=[img=utility/custom_tag_icon] Factory Radar commands
commands-hint=Type them in chat (~ or Enter). [ ] - optional part.
col-cmd=Command
col-who=Who
col-what=What it does
admin=admin
everyone=everyone
tr-where=Who's where and where they are looking. With a name - just that player: /tr-where Oleg
tr-now=The current shift in short: who's online, leaders, planets, time to summary.
tr-top=All-time leaderboard, or this shift: /tr-top shift
tr-me=Your card: stats and next titles. With a name - someone else's: /tr-me Oleg
tr-vs=Compare yourself with a player on 6 stats: /tr-vs Oleg
tr-planets=Planet list: mastered or not, what's missing, who landed first.
tr-research=Research progress and infinite research.
tr-combat=What killed enemies most often and enemy evolution per planet.
tr-log=Recent journal events: /tr-log 20
tr-mvp=Vote for the shift MVP (not yourself): /tr-mvp Oleg
tr-shift-now=Close the shift right now and start a new one.
faq=[img=utility/tip_icon] FAQ
faq-1=[font=default-bold]What counts as “Built”?[/font] Everything a player placed by hand and everything robots built from their ghosts and blueprints. Robot building can be turned off in the server settings (Settings tab → tracking).
faq-2=[font=default-bold]Why isn't the planet mastered?[/font] It needs all of its local science made on it and a powered rocket silo. What's missing is on the Planets tab or /tr-planets.
faq-3=[font=default-bold]Where do I change the shift length?[/font] In the main menu: Settings → Mod settings → Startup.
faq-4=[font=default-bold]How do I reset everything?[/font] Settings tab → “Restore all server settings to default” (statistics are kept).
faq-7=[font=default-bold]What does "+12% vs last shift" mean, and what is a record?[/font] The mod compares how many items per hour a planet makes now with what it made in the last closed shift: "+12%" means 12% more. Separately, every planet remembers its best pace (the best of the last 10 full shifts): when a planet runs below the threshold from the settings (25% by default) of it, the report calls it idle. The Records tab holds the best results of the players and of the team in one shift.
tr-census=Recount who built how much on every planet (from the buildings that stand). It runs in small steps and does not slow the game. The result is in the Summary (all time) and in the planet titles.

