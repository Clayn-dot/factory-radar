[tr-tips]
t20=You can strike a friend with lightning from Who is where: it does not kill and does not touch buildings.
t19=In Power grids, “at the limit” means the demand is close to the maximum production. Hover it to see why.
t18=Esc closes the window, Ctrl+Shift+R opens it.
t17=Every title has its own colour; planet titles depend on what the planet has: lava, oil, uranium, enemies.
t16=The native science of a planet can be corrected right in its card, the Change button.
t15=In Quality, Power grids and Platforms you can hide what you do not need - hidden things are not computed either.
t14=Hover a bar between planets in a platform route to see the length of the hop, its time and speed.
t13=Pin a platform with the button at the top right of its card - it will always come first.
t1=Tip: pin the tabs you use with “Pin” - they go to the quick access row.
t2=Tip: the “Shift / All time” switch at the top changes every number in the window.
t3=Tip: in “Who's where” one click shows where a player stands and where they are looking.
t4=Tip: pick a chat title in the “Titles” tab - it shows next to your name.
t5=Tip: hover a bar or a number - almost everything has details.
t6=Tip: vote for the shift MVP on the Summary - the vote is secret and can be changed until the shift ends.
t7=Tip: Ctrl+Shift+R opens and closes this window.
t8=Tip: the “Planets” tab shows what is missing to master a planet.
t9=Tip: hover a platform's asteroids to see every kind, biggest first.
t10=Tip: a red bar in “Power grids” means the network is short of power.
t11=Tip: hide tabs you don't need in Settings → “Which tabs to show”.
t12=Tip: in “Quality” clicking an item icon removes it from your list (only for you).

