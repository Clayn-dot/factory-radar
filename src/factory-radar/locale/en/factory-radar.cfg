[mod-name]
factory-radar=Factory Radar

[mod-description]
factory-radar=Your whole factory in one window. See what every planet produces, where your space platforms are and what they carry, where the power fails and why, how research goes, and find any item across all logistic networks in one click. Just as useful in a solo game; with friends you also get who is where, titles and achievements, and some fun: a friendly lightning strike on a friend and a quiz with a prize nobody wants.

[mod-setting-name]
tr-s-roulette-join=Quiz: seconds to agree
tr-s-roulette-cooldown=Quiz: how often (minutes of game time)
tr-s-roulette=Fun quiz (on/off)
tr-s-zap-percent=Lightning: damage (% of health)
tr-s-zap-cooldown=Lightning: cooldown (seconds)
tr-s-mvp-reminder=MVP reminder (minutes before the summary)
tr-s-shift-hours=Shift length (hours)
tr-s-afk-minutes=AFK after (minutes)
tr-s-death-limit=Death comments per minute
tr-s-journal=Journal entries
tr-s-history=Shifts in history charts
tr-s-idle-percent=Planet is idle below (% of best pace)
tr-s-min-output=Min. planet output for the report
tr-s-shortcut=Shortcut bar button
tr-s-white-icon=White radar icon
tr-s-roulette-fail=Quiz: pause if nobody agreed (minutes)

[mod-setting-description]
tr-s-roulette-join=How many seconds players have to agree after the start.
tr-s-roulette-cooldown=How many minutes of game time must pass after a surprise before the next quiz. 0 - no cooldown: a new quiz cannot be started only while the previous one is running.
tr-s-roulette=Players can start a quiz: those who agree (/tr-in) are the pool, fate picks one of them and a surprise awaits that player. It only hits buildings and characters of the players, enemies and nature are left alone. At least two must agree.
tr-s-zap-percent=How much of the character's max health a strike takes. Lightning never kills: at least 1 HP is left.
tr-s-zap-cooldown=How often one player can strike.
tr-s-mvp-reminder=How many minutes before the shift summary the mod asks in chat to vote for the MVP. 0 - no reminder.
tr-s-shift-hours=Every this many hours of game time the shift is summed up. Fractions work: 0.5 = 30 minutes.
tr-s-afk-minutes=After how many minutes without moving a player counts as AFK (zZz, AFK time for the title).
tr-s-death-limit=How many deaths of one player per minute get a chat comment. The rest are folded into "and N more".
tr-s-journal=How many recent events the Journal tab keeps.
tr-s-history=How many recent shifts the history bars show (planet output, evolution).
tr-s-idle-percent=Planet report: below which share of its own best pace (items per hour) a planet counts as idle.
tr-s-min-output=Planet report: planets that produced at least this many items in the shift.
tr-s-shortcut=Factory Radar button on the shortcut bar (bottom right). The window also opens with Ctrl+Shift+R.
tr-s-white-icon=A white radar on grey in the game's UI style. Turn off to use the regular Radar item icon.
tr-s-roulette-fail=If the one who started stays alone and all the others decline, a new quiz cannot be started for this many minutes. The question window does not appear for the others again.

