[tr-tips]
t20=Молнией можно ударить друга из вкладки «Где кто»: она не убивает и не трогает постройки.
t19=В «Электросетях» метка «на грани» значит, что потребление близко к максимуму выработки. Наведи на неё, чтобы узнать причину.
t18=Esc закрывает окно, Ctrl+Shift+R открывает его.
t17=У каждого звания свой цвет; планетные звания зависят от того, что есть на планете: лава, нефть, уран, враги.
t16=Родную науку планеты можно поправить прямо в её карточке, кнопка «Изменить».
t15=В «Качестве», «Электросетях» и «Платформах» можно скрыть лишнее — скрытое ещё и не считается.
t14=Наведи на полоску между планетами в маршруте платформы — увидишь длину перелёта, время и скорость.
t13=Закрепи платформу кнопкой справа сверху её карточки — она всегда будет первой.
t1=Закрепи нужные вкладки кнопкой «Закрепить» — они встанут в строку быстрого доступа.
t2=Переключатель «Смена / Всё время» сверху меняет все цифры в окне.
t3=Во вкладке «Где кто» можно в один клик посмотреть, где игрок стоит и куда он смотрит.
t4=Выбери звание для чата во вкладке «Звания» — оно встанет рядом с ником.
t5=Наведи мышь на полоску или число — почти везде есть подробности.
t6=Голосуй за MVP смены на Сводке — голос тайный, можно передумать до конца смены.
t7=Ctrl+Shift+R открывает и закрывает это окно.
t8=На вкладке «Планеты» видно, чего не хватает, чтобы освоить планету.
t9=У астероидов на платформе при наведении есть список всех видов, от самых крупных.
t10=В «Электросетях» красная полоска — сети не хватает мощности.
t11=Лишние вкладки можно скрыть в Настройках → «Какие вкладки показывать».
t12=В «Качестве» клик по иконке предмета убирает его из списка (только у тебя).
t21=«Поиск предмета» ищет на планетах, платформах и у игроков. Клик по месту: перелетишь туда и увидишь контейнеры.
t22=В поиске предмета сети и игроки включены сразу. Сундуки вне сетей и машины ищутся дольше, поэтому выключены.
t23=Окно поиска предмета можно свернуть кнопкой рядом с обновлением: оно останется на экране маленькой полоской.
t24=Наведи на контейнер в поиске предмета — увидишь его координаты.
t25=Вкладка «Качество» показывает, что ваши планеты сделали выше обычного качества.
t26=Вехи науки — 1-я, 1 000-я, 10 000-я, 100 000-я, миллионная и миллиардная колба каждого вида.
t27=Разрушенная платформа попадает в свой список — с маршрутом, на котором она была, и вероятной причиной.
t28=Админ может сбросить или откатить любую статистику по одному разделу в Настройках.
t29=/tr-now в чате покажет лидеров смены и время до итогов.
t30=/tr-me [имя] показывает карточку игрока в чате, /tr-vs имя сравнивает тебя с другим игроком.
t31=Вкладка «Бой» показывает эволюцию каждой вражеской силы с историей по сменам.
t32=Журнал «Электросетей» хранит последние события — видно, что случилось, пока тебя не было.
t33=Каждый игрок может отключить ненужные сообщения в чате в Настройках, только у себя.
t34=Любой может начать весёлую викторину командой /tr-roulette, согласившиеся входят командой /tr-in.
t35=Молния никогда не убивает, она забирает часть здоровья. У неё есть перезарядка, и ударить можно даже себя.

