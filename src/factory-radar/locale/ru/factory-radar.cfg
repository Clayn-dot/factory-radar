why-gen-nofluid=К __1__ паровым машинам или турбинам не приходит пар: проверь котлы, реакторы и трубы.
why-gen-nofluid-past=К __1__ паровым машинам или турбинам не приходил пар: котлы, реакторы или трубы.
why-night-short=Солнца нет, и аккумуляторов не хватит до рассвета: заряда примерно на __1__ мин, ночь продлится ещё около __2__ мин. Ожидается нехватка.
why-night-short-past=Солнца не было, и аккумуляторов не хватило до рассвета: заряда было примерно на __1__ мин, ночь длилась ещё около __2__ мин.
why-night-cap=Аккумуляторы держат около __1__ мин при текущем потреблении, а ночь длится около __2__ мин: на всю ночь не хватит.
why-night-cap-past=Аккумуляторы держали около __1__ мин при том потреблении, а ночь длилась около __2__ мин: на всю ночь не хватало.
plat-head=Электропитание космических платформ
plat-tip=Каждая платформа — одна сеть (столбы не нужны). Статистики сети игра для неё не даёт, поэтому потребление оценивается по машинам (работающая тянет максимум, стоящая — только то, что тянет в простое) и сверяется с зарядом аккумуляторов и тем, что дают источники, поэтому выше этого не показывается. Красное: машинам не хватает или нет энергии, аккумуляторы пусты и источники не покрывают потребление, или источников нет. Жёлтое: заряд на исходе, топливо на исходе, потребление у предела или растёт. Рядом с полоской: оценка потребления и максимум, что могут дать источники здесь (по составу, качеству и солнцу в космосе там, где платформа сейчас). Синяя полоска — заряд аккумуляторов.
plat-tip-nums=Источники дают не больше __1__, работающие машины могут потребить до __2__, оценка потребления сейчас __3__.\nИсточников энергии: __4__, аккумуляторов: __5__.
plat-no-acc=нет аккумуляторов
chip-empty=[color=1,0.45,0.4]аккумуляторы пусты[/color]
chip-nosrc=[color=1,0.45,0.4]нет источников энергии[/color]
kindn-empty=аккумуляторы разрядились
plat-why-none=Машины на платформе остались без энергии.
plat-why-none-past=Машины на платформе остались без энергии.
plat-why-low=Машины работают медленно: платформе не хватает энергии.
plat-why-low-past=Машины работали медленно: платформе не хватало энергии.
plat-why-empty=Аккумуляторы пусты (__1__%), а источники не покрывают потребление: заряд кончился.
plat-why-empty-past=Аккумуляторы были пусты (__1__%), а источники не покрывали потребление: заряд кончился.
plat-why-nosrc=На платформе нет источников энергии (солнечных панелей, генераторов), а потребители есть.
plat-why-nosrc-past=На платформе не было источников энергии, а потребители были.
plat-why-acc-low=Аккумуляторы почти пусты (__1__%), а потребление выше выработки.
plat-why-acc-low-past=Аккумуляторы были почти пусты (__1__%), а потребление было выше выработки.
plat-why-limit=Потребление __1__ почти равно максимуму источников (__2__).
plat-why-limit-past=Потребление __1__ было почти равно максимуму источников (__2__).
chip-r-fuellow=[color=1,0.8,0.4]топливо на исходе[/color]
chip-r-trend=[color=1,0.8,0.4]потребление растёт[/color]
why-trend-cap=Потребление растёт примерно на __1__% в час: в таком темпе оно упрётся в максимум источников минут через __2__.
why-trend-cap-past=Потребление росло примерно на __1__% в час: в таком темпе оно упёрлось бы в максимум источников минут через __2__.
why-fuel-low=Топливо реакторов и котлов только убывает и закончится примерно через __1__ мин.
why-fuel-low-past=Топливо реакторов и котлов только убывало и заканчивалось примерно через __1__ мин.
note-trend-up=Тренд: потребление растёт примерно на __1__% в час.
note-trend-down=Тренд: потребление падает примерно на __1__% в час — часть завода могла встать или быть потеряна.
note-trend-long=По сравнению с 2–3 часами назад потребление изменилось на __1__%.
log-share=До __1__% проверяемых машин работали не на полную мощность.

