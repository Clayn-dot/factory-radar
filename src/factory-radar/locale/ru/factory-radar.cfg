[mod-name]
factory-radar=Фабричный радар (Factory Radar)

[mod-description]
factory-radar=Вся ваша фабрика в одном окне. Что производит каждая планета, где космические платформы и что они везут, где и почему пропадает электричество, как идут исследования, а ещё поиск любого предмета по логистическим сетям всех планет. Так же полезен в одиночной игре; с друзьями добавляются «кто где», звания и достижения и немного веселья: дружеский удар молнией по другу и викторина с призом, который никому не нужен.

[mod-setting-name]
tr-s-roulette-join=Викторина: сколько секунд на согласие
tr-s-roulette-cooldown=Викторина: как часто (минут игрового времени)
tr-s-roulette=Весёлая викторина (вкл/выкл)
tr-s-zap-percent=Молния: урон (% здоровья)
tr-s-zap-cooldown=Молния: перезарядка (секунд)
tr-s-mvp-reminder=Напоминание о MVP (минут до итогов)
tr-s-shift-hours=Длина смены (часы)
tr-s-afk-minutes=АФК через (минут)
tr-s-death-limit=Комментариев к смертям в минуту
tr-s-journal=Записей в журнале
tr-s-history=Смен в истории графиков
tr-s-idle-percent=Планета простаивает ниже (% от лучшего темпа)
tr-s-min-output=Мин. выпуск планеты для отчёта
tr-s-shortcut=Кнопка на панели быстрого доступа
tr-s-white-icon=Белая иконка радара
tr-s-roulette-fail=Викторина: пауза, если никто не согласился (минут)

[mod-setting-description]
tr-s-roulette-join=Сколько секунд игроки могут согласиться участвовать после запуска.
tr-s-roulette-cooldown=Сколько минут игрового времени должно пройти после сюрприза до следующей викторины. 0 — без перезарядки: новую викторину нельзя запустить, только пока идёт прошлая.
tr-s-roulette=Игроки могут запустить викторину: кто согласится (/tr-in), среди тех судьба выбирает одного, и его ждёт сюрприз. Бьёт только по постройкам и персонажам игроков, врагов и природу не трогает. Нужно минимум двое согласных.
tr-s-zap-percent=Сколько процентов от максимального здоровья персонажа снимает удар. Молния никогда не убивает: минимум остаётся 1 ед. здоровья.
tr-s-zap-cooldown=Как часто один игрок может бить молнией.
tr-s-mvp-reminder=За сколько минут до итогов смены мод предложит в чате проголосовать за MVP. 0 — не напоминать.
tr-s-shift-hours=Раз в столько часов игрового времени подводятся итоги смены. Можно дробно: 0.5 = 30 минут.
tr-s-afk-minutes=Через сколько минут без движения игрок считается АФК (zZz над головой, время АФК для звания).
tr-s-death-limit=Сколько смертей одного игрока за минуту комментируется в чате. Остальные сворачиваются в «и ещё N раз».
tr-s-journal=Сколько последних событий хранит вкладка «Журнал».
tr-s-history=Сколько последних смен показывают полоски истории (выпуск планет, эволюция).
tr-s-idle-percent=В отчёте по планетам: ниже какой доли от своего лучшего темпа (предметов в час) планета считается простаивающей.
tr-s-min-output=В отчёте по планетам учитываются планеты, выпустившие за смену хотя бы столько предметов.
tr-s-shortcut=Кнопка Factory Radar на панели быстрого доступа (справа внизу). Окно также открывается клавишей Ctrl+Shift+R.
tr-s-white-icon=Белый радар на сером фоне в стиле интерфейса. Выключи, чтобы была обычная иконка предмета «Радар».
tr-s-roulette-fail=Если запустивший остался один, а остальные отказались, новую викторину нельзя запустить столько минут. Окно с вопросом больше не появится у остальных.

