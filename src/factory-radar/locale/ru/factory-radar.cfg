not-open=Сейчас никто не запускал викторину, согласие не нужно.
start=Весёлая викторина запущена! __1__ запустил её. Выбор будет между теми, кто согласится. Хочешь участвовать — нажми «Участвую» в окне сверху или напиши /tr-in. На ответ __2__ с. Сейчас онлайн: __3__.
few=Для викторины нужно минимум двое живых игроков онлайн.
no-body=Для викторины нужен живой персонаж на планете (не на платформе).
cooldown=Викторина отдыхает: ещё __1__ (игровое время).
