faq-6=[font=default-bold]Что если голоса за MVP разделились поровну?[/font] MVP будет несколько — все, кто набрал больше всего голосов.
how=[img=utility/tip_icon] Как пользоваться
how-1=• Окно открывается кнопкой-радаром слева вверху, клавишей [font=default-bold]Ctrl+Shift+R[/font] или кнопкой на панели быстрого доступа.
how-2=• Переключатель в заголовке окна: «За смену» (по умолчанию) или «За всё время» — действует на все вкладки.
how-3=• «Команда → Где кто»: [img=tr-map-frame] — перенести обзор к игроку, [img=utility/search] — туда, куда он сейчас смотрит.
how-4=• Своё звание для чата — «Команда → Звания». Голос за MVP — на «Сводке».
how-5=• Лишние вкладки и сообщения прячутся в «Настройках» (у каждого свои). Админ там же настраивает учёт, сообщения, звания и родную науку планет.
