faq=[img=utility/tip_icon] Вопросы
faq-1=[font=default-bold]Что считается в «Построил»?[/font] Всё, что игрок поставил руками. Постройки роботов по призракам и чертежам засчитываются, только если игра знает, чей это был призрак, и админ может выключить это (вкладка «Настройки» → учёт).
faq-2=[font=default-bold]Почему планета не освоена?[/font] Нужна вся её родная наука, произведённая на ней, и запитанная ракетная шахта. Чего не хватает — видно на вкладке «Планеты» или /tr-planets.
faq-3=[font=default-bold]Где менять длину смены?[/font] В главном меню: Настройки → Настройки модов → Запуск.
faq-4=[font=default-bold]Как вернуть всё как было?[/font] Вкладка «Настройки» → кнопка «Вернуть все настройки сервера по умолчанию» (статистика сохранится).
faq-7=[font=default-bold]Что значит «+12% к прошлой смене» и что такое рекорд?[/font] Мод сравнивает, сколько предметов в час планета даёт сейчас, с тем, сколько она давала в прошлую закрытую смену: «+12%» — на 12% больше. Отдельно для каждой планеты помнится её лучший темп (лучший из последних 10 полных смен): если планета работает ниже порога из настроек (по умолчанию 25%) от него, в отчёте она «простаивает». На вкладке «Рекорды» собраны лучшие результаты игроков и команды за одну смену.
tr-census=Пересчитать, кто сколько построил на каждой планете (по стоящим постройкам). Идёт понемногу, игру не тормозит. Результат — в «Сводке» (за всё время) и в званиях планет.
faq-8=[font=default-bold]Как работает поиск предмета?[/font] Нажми «Поиск предмета», выбери предмет и качество. В списке планеты и платформы, больше всего первыми. Галочки выбирают, где искать: логистические сети, то, что несут игроки, сундуки вне сетей и внутри машин (последние два дольше и сначала выключены). Клик по месту: перелетишь туда; наведи на строку, чтобы увидеть координаты.
faq-9=[font=default-bold]Когда проблема с энергией попадает в журнал?[/font] Красная запись: машинам правда не хватало энергии 10 секунд (нет тока) или минуту (мало: четверть и больше проверяемых машин работают не на полную мощность); у платформы ещё и пустые аккумуляторы. Жёлтая: сеть работает, но серьёзная причина держится около 5 минут: нет топлива или пара, топливо на исходе, аккумуляторов не хватит до рассвета, быстрая разрядка. Замеры идут примерно раз в 20 секунд, хранится час истории, поэтому короткие провалы не пишутся. Наведи на планету или платформу, чтобы увидеть вероятную причину и тренд потребления.
how-6=• «Поиск предмета» в строке быстрого доступа: где лежит предмет на планетах, платформах и у игроков. Совет о моде всегда виден внизу окна.

